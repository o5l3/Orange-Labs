<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f97316" />

    <!--
      검색엔진 소유권 확인 태그.
      seo:start ~ seo:end 밖에 두어야 경로별 사전 렌더링 후에도 남는다.
      data-seo-static을 붙이면 main.tsx가 런타임에 걷어내므로 붙이면 안 된다.

      Google  — Search Console URL 접두어 속성(https://www.orangelabs.xyz/)용.
                도메인 속성(orangelabs.xyz)은 이 태그가 아니라 DNS TXT로 확인한다.
      Naver   — 서치어드바이저 사이트 소유확인용.
    -->
    <meta
      name="google-site-verification"
      content="-9vu-vTr89I0u_BkKltxan_rTmkTI8V4jjAYPifVgdQ"
    />
    <meta name="naver-site-verification" content="8bc642dbe23cce17b042707d162d64acdc679a4b" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <!--
      seo:start ~ seo:end 사이는 빌드 후 scripts/generate-seo.mjs 가 경로별로 교체한다.
      여기 있는 값은 사전 렌더링되지 않은 경로의 기본값이며,
      런타임에는 src/components/Seo.tsx 가 이 태그들을 제거하고 직접 관리한다.
    -->
    <!-- seo:start -->
    <title data-seo-static>오렌지랩스 OrangeLabs | 엔드포인트 성능·장애관리 솔루션</title>
    <meta
      data-seo-static
      name="description"
      content="오렌지랩스(OrangeLabs)는 실시간 성능 장애 예측으로 IT를 편하게 만듭니다. GS 1등급 인증을 받은 엔드포인트 성능·장애관리 솔루션 Orange The Client를 만나보세요."
    />
    <link data-seo-static rel="canonical" href="https://www.orangelabs.xyz/" />
    <meta data-seo-static name="robots" content="index, follow, max-image-preview:large" />
    <meta data-seo-static property="og:site_name" content="OrangeLabs" />
    <meta data-seo-static property="og:type" content="website" />
    <meta
      data-seo-static
      property="og:title"
      content="오렌지랩스 OrangeLabs | 엔드포인트 성능·장애관리 솔루션"
    />
    <meta
      data-seo-static
      property="og:description"
      content="오렌지랩스(OrangeLabs)는 실시간 성능 장애 예측으로 IT를 편하게 만듭니다. GS 1등급 인증을 받은 엔드포인트 성능·장애관리 솔루션 Orange The Client를 만나보세요."
    />
    <meta data-seo-static property="og:url" content="https://www.orangelabs.xyz/" />
    <meta
      data-seo-static
      property="og:image"
      content="https://www.orangelabs.xyz/images/orangebox.png"
    />
    <meta data-seo-static property="og:image:width" content="720" />
    <meta data-seo-static property="og:image:height" content="720" />
    <meta data-seo-static property="og:locale" content="ko_KR" />
    <meta data-seo-static name="twitter:card" content="summary_large_image" />
    <meta
      data-seo-static
      name="twitter:title"
      content="오렌지랩스 OrangeLabs | 엔드포인트 성능·장애관리 솔루션"
    />
    <meta
      data-seo-static
      name="twitter:description"
      content="오렌지랩스(OrangeLabs)는 실시간 성능 장애 예측으로 IT를 편하게 만듭니다. GS 1등급 인증을 받은 엔드포인트 성능·장애관리 솔루션 Orange The Client를 만나보세요."
    />
    <meta
      data-seo-static
      name="twitter:image"
      content="https://www.orangelabs.xyz/images/orangebox.png"
    />
    <!-- seo:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
